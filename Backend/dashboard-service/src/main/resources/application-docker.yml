server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-dashboard}:${MYSQL_PORT:3306}/dashboard_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
