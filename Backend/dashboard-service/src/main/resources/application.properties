# =============================================
# Dashboard Service - SmartRide
# =============================================
server.port=8088
spring.application.name=dashboard-service

# =============================================
# MySQL DataSource
# =============================================
DB_HOST=localhost
DB_PORT=3306
DB_NAME=smartride_dashboard
DB_USER=root
DB_PASSWORD=

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# Keycloak OAuth2 Resource Server (JWT)
# =============================================
KEYCLOAK_URL=http://localhost:8180
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}/realms/smartride-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL}/realms/smartride-realm/protocol/openid-connect/certs

# =============================================
# RabbitMQ Messaging
# =============================================
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_USER=guest
RABBITMQ_PASS=guest

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# =============================================
# Eureka Discovery Client
# =============================================
EUREKA_SERVER=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =============================================
# SpringDoc / Swagger UI
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=SmartRide Dashboard Service API
springdoc.info.description=API du tableau de bord administrateur SmartRide avec RabbitMQ et Sécurité Keycloak
springdoc.info.version=1.0.0
