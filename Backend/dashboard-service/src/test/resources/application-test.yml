# ============================================================
#  Configuration de TEST — utilise H2 (en mémoire) à la place de MySQL
#  Active avec : @ActiveProfiles("test")
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true

  cloud:
    openfeign:
      enabled: false

  # Disable RabbitMQ auto-connect in tests
  rabbitmq:
    listener:
      simple:
        auto-startup: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://mock-keycloak/certs

# Désactiver Eureka pendant les tests
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
