# =============================================
# API Gateway - SmartRide (Module Dashboard - Ibtihel)
# =============================================
server.port=8080
spring.application.name=api-gateway

# =============================================
# Spring Cloud Gateway - Discovery & Routing
# =============================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route: Dashboard Service (Ibtihel Baccari)
spring.cloud.gateway.routes[0].id=dashboard-service
spring.cloud.gateway.routes[0].uri=lb://dashboard-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/dashboard/**

# =============================================
# Eureka Client Configuration
# =============================================
EUREKA_SERVER=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5

# =============================================
# Actuator & Logging
# =============================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
logging.level.org.springframework.cloud.gateway=INFO
