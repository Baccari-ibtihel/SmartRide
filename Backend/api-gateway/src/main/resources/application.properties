# =============================================
# API Gateway - SmartRide
# =============================================
server.port=8080
spring.application.name=api-gateway

# =============================================
# Keycloak OAuth2 Resource Server (JWT)
# =============================================
KEYCLOAK_URL=http://localhost:8180
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}/realms/smartride-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL}/realms/smartride-realm/protocol/openid-connect/certs

# =============================================
# Spring Cloud Gateway - Discovery & Routing
# =============================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route 1: Dashboard Service (Admin Only - Ibtihel)
spring.cloud.gateway.routes[0].id=dashboard-service
spring.cloud.gateway.routes[0].uri=lb://dashboard-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/dashboard/**

# Route 2: User Service (Auth & Profiles)
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Route 3: Trip Service (Go - Aymen)
spring.cloud.gateway.routes[2].id=trip-service
spring.cloud.gateway.routes[2].uri=lb://trip-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/trips/**

# Route 4: Booking Service (Node.js - Ghofran)
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

# Route 5: Payment Service (Python FastAPI - Mahdi)
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**,/payments/**

# Route 6: Rating & Chat Service (Java Spring Boot - Hamza)
spring.cloud.gateway.routes[5].id=rating-chat-service
spring.cloud.gateway.routes[5].uri=lb://rating-chat-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ratings/**,/api/chat/**

# Route 7: Rating & Chat WebSocket (STOMP WS - Hamza)
spring.cloud.gateway.routes[6].id=rating-chat-ws
spring.cloud.gateway.routes[6].uri=lb:ws://rating-chat-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/ws/**

# Route 8: Notification & Tracking Service (PHP Symfony - Hafedh)
spring.cloud.gateway.routes[7].id=notification-tracking-service
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-TRACKING-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**,/api/tracking/**

# Route 9: AI Matching Service (FastAPI)
spring.cloud.gateway.routes[8].id=matching-ia-service
spring.cloud.gateway.routes[8].uri=lb://matching-ia-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/matching/**

# =============================================
# Eureka Client Configuration
# =============================================
EUREKA_SERVER=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5

# =============================================
# Actuator & Logging
# =============================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
